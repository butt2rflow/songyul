<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="title"></title>
<meta name="robots" content="noindex">
<style>
:root { --bg: #0f1214; --panel: #1a1f23; --fg: #eef1f3; --muted: #9aa5ad; --accent: #4fc3f7; --ok: #66bb6a; --warn: #ffb74d; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Noto Sans KR", system-ui, sans-serif; }
.wrap { max-width: 900px; margin: 0 auto; padding: 12px 16px 28px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
/* Never wider than the screen: grid/flex children may shrink below their text width (a one-line title used to widen the
   whole page to ~620 px on a ~400 px phone, so Chrome zoomed and re-laid it out as numbers changed). */
.wrap > *, .row > *, .chart, .chart > *, .num { min-width: 0; max-width: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.chart .head > span:has(.key) { white-space: normal; overflow: visible; }   /* legends may wrap; titles stay one line */
.key { white-space: nowrap; }   /* no Chrome font boosting on content updates */
html, body { overflow-x: hidden; }
h1 { font-size: 20px; margin: 4px 0 0; }
p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
.stage { position: relative; width: 100%; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 3 / 4; }
video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
video { opacity: 0; }
.hud { position: absolute; left: 8px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: rgba(0,0,0,.6); border-radius: 6px; padding: 3px 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.num { background: var(--panel); border-radius: 8px; padding: 8px 10px; }
.num b { display: block; font-size: clamp(18px, 5vw, 26px); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.num span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.num small { display: block; color: var(--accent); font-size: 12px; min-height: 1.4em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
button, select, label.file { white-space: nowrap;  background: var(--panel); color: var(--fg); border: 1px solid #2d353b; border-radius: 8px; padding: 10px 14px; font-size: 15px; cursor: pointer; }
button.primary { background: var(--accent); color: #002433; border-color: var(--accent); font-weight: 700; }
button:disabled { opacity: .5; }
label.file input { display: none; }
#msg { position: fixed; left: 50%; top: 40px; transform: translateX(-50%); width: min(92vw, 520px); z-index: 25; color: var(--fg); font-size: 14px; line-height: 1.45;
  background: rgba(26, 31, 35, .95); border: 1px solid #2d353b; border-left: 4px solid var(--warn); border-radius: 10px; padding: 8px 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,.5); opacity: 0; transition: opacity .4s ease; pointer-events: none; }
#msg.show { opacity: 1; }
details { background: var(--panel); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
details summary { color: var(--fg); cursor: pointer; }
details li { margin: 4px 0; }
a { color: var(--accent); }
.charts { display: grid; gap: 8px; }
.chart { background: var(--panel); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; }
.chart .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-height: 2em; }
.chart .head > span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart canvas { position: static; display: block; width: 100%; height: 150px; background: #0b0e10; border-radius: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .g { width: 100%; font-size: 12px; color: var(--muted); margin-top: 4px; }
.chip { background: #232a2f; color: var(--fg); border: 1px solid #2d353b; border-radius: 16px; padding: 6px 12px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--accent); color: #002433; border-color: var(--accent); font-weight: 700; }
.chip.lab { border-color: #555f66; }
.chip.add { border-style: dashed; color: var(--muted); }
.chip .x { margin-left: 6px; color: #ff8a80; }
#nowSet { font-size: 15px; color: var(--fg); }
.key { display: inline-flex; align-items: center; gap: 4px; margin-left: 10px; color: var(--fg); }
.live { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: clamp(11px, 3.2vw, 14px); table-layout: fixed; }
.live col.part { width: 5.5em; }
html[lang="en"] .live col.part { width: 7em; }
.live th { color: var(--muted); font-weight: 400; font-size: 0.85em; text-align: right; padding: 2px 2px; white-space: nowrap; }
.live td { text-align: right; padding: 3px 2px; border-top: 1px solid #2d353b; white-space: nowrap; overflow: hidden; }
.live td:first-child, .live th:first-child { text-align: left; }
html[lang="en"] .live td:first-child .key { white-space: normal; }
.key i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.sw { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: clamp(11px, 3.2vw, 14px); table-layout: fixed; }
.sw th { color: var(--muted); font-weight: 400; font-size: 0.85em; text-align: right; padding: 2px; white-space: normal; line-height: 1.2; }
.sw td { text-align: right; padding: 4px 2px; border-top: 1px solid #2d353b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw td:first-child, .sw th:first-child { text-align: left; }
.sw td.sat { color: var(--warn); }
#lastShot .ls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
#lastShot .num { padding: 5px 7px; border-left: 3px solid #4fc3f7; }
#lastShot .num.r10 { border-left-color: #81c784; } #lastShot .num.body { border-left-color: #ffb74d; }
#lastShot .num span { font-size: 11px; } #lastShot .num b { font-size: clamp(16px, 4.6vw, 22px); }
html[lang="en"] #lastShot .num span { white-space: normal; }
#lastShot .num small { font-size: 11px; min-height: 0; }
.lskey { display: flex; gap: 12px; font-size: 11px; color: var(--muted); margin-top: 4px; }
.lskey span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: #4fc3f7; }
.lskey .r10::before { background: #81c784; } .lskey .body::before { background: #ffb74d; }
.stage { aspect-ratio: auto; height: max(300px, calc(100dvh - 310px)); }   /* camera takes the screen; the result card still fits below */
.stage canvas { width: 100%; height: 100%; object-fit: contain; }
.wrap > .row button, .wrap > .row label.file { padding: 7px 11px; font-size: 14px; }
.wrap > .row { gap: 6px; }
.dock { display: flex; flex-direction: column; gap: 6px; }
#dock { position: fixed; top: 0; left: 50%; transform: translate(-50%, 0); width: min(100%, 900px); z-index: 30;
  background: var(--panel); border: 1px solid #2d353b; border-top: none; border-radius: 0 0 14px 14px; padding: 10px 14px 14px;
  box-shadow: 0 6px 22px rgba(0,0,0,.6); transition: transform .25s ease; }
body.docked #dock { transform: translate(-50%, -110%); }
#dockTab { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 29; display: none; align-items: center; gap: 6px;
  border-top: none; border-radius: 0 0 12px 12px; padding: 4px 18px 7px; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.5); }
body.docked #dockTab { display: flex; }
.wrap { padding-top: 30px; }   /* room for the menu tab */
#dockRim { position: fixed; top: 0; left: 0; right: 0; height: 22px; z-index: 28; display: none; }
body.docked #dockRim { display: block; }
#recDot { display: none; width: 9px; height: 9px; border-radius: 50%; background: #ef5350; }
body.recording #recDot { display: inline-block; }
#swOv { position: absolute; left: 8px; right: 8px; top: 44px; background: rgba(10, 13, 15, .8); border-radius: 10px; padding: 6px 8px 8px;
  opacity: 0; transition: opacity .6s ease; pointer-events: none; }
#swOv.show { opacity: 1; }
#swOvTitle { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
#swOv .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
#swOv .row4 div { border-left: 3px solid #4fc3f7; padding-left: 5px; }
#swOv .row4 div.r10 { border-left-color: #81c784; }
#swOv .row4 span { display: block; font-size: 10px; color: var(--muted); white-space: nowrap; }
#swOv .row4 b { font-size: 18px; font-variant-numeric: tabular-nums; }
#impOv { position: absolute; left: 8px; right: 8px; bottom: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  opacity: 0; transition: opacity .35s ease; pointer-events: none; }
#impOv.show { opacity: 1; }
#impOv figure { margin: 0; background: rgba(10, 13, 15, .78); border-radius: 8px; padding: 4px; }
#impOv canvas { position: static; inset: auto; display: block; width: 100%; height: 64px; border-radius: 4px; }
#impOv figcaption { font-size: 11px; color: var(--fg); padding: 2px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#clubWheel { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at center, rgba(8,10,12,.82) 0%, rgba(8,10,12,.55) 70%, rgba(8,10,12,0) 100%);
  opacity: 0; transition: opacity .35s ease; pointer-events: none; }
#clubWheel.show { opacity: 1; }
#clubWheel .cw-stage { width: 100%; height: 260px; perspective: 420px; display: flex; align-items: center; justify-content: center; }
#clubWheel .cw-ring { position: relative; width: 0; height: 0; transform-style: preserve-3d; transition: transform .75s cubic-bezier(.22, 1.25, .36, 1); }
#clubWheel .ci { position: absolute; left: -60px; top: -44px; width: 120px; height: 88px; border-radius: 16px; display: flex; align-items: center;
  justify-content: center; font-weight: 800; font-size: 26px; color: #eef1f3; background: #1f262b; border: 2px solid #2d353b;
  backface-visibility: hidden; transition: opacity .4s ease, background .3s, border-color .3s, box-shadow .3s; }
#clubWheel .ci.sel { background: #4fc3f7; color: #002433; border-color: #b3e5fc; box-shadow: 0 0 34px rgba(79,195,247,.85); }
#clubWheel .cw-name { margin-top: 18px; font-size: 40px; font-weight: 800; color: #fff; text-shadow: 0 2px 18px rgba(79,195,247,.9); }
.language { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.language button { padding: 3px 9px; font-size: 12px; }
#vHeard { overflow-wrap: anywhere; }
html[lang="en"] :is(#swTitle, #clipTitle, #impTitle, #gLast) { white-space: normal; }
html[lang="en"] #gLast { text-align: right; }
html[lang="en"] #swingBox col:last-child { width: 3.8em; }
html[lang="en"] #swRows td:last-child { white-space: normal; }
details.note{margin-top:6px} details.note summary{font-size:13px;color:var(--muted);cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<div id="dockRim" aria-hidden="true"></div>
<div id="clubWheel" aria-hidden="true"><div class="cw-stage"><div class="cw-ring" id="cwRing"></div></div><div class="cw-name" id="cwName"></div></div>
<button id="dockTab" data-i18n-aria="menuOpen"><span data-i18n="menuTab"></span><span id="recDot"></span></button>

  <div class="dock" id="dock">
  <div class="row">
    <button id="start" class="primary" data-i18n="cameraStart"></button>
    <button id="base" disabled data-i18n="address"></button>
    <button id="rec" disabled data-i18n="recordVideo"></button>
    <label class="file" style="display:flex;align-items:center;gap:6px"><input id="speak" type="checkbox" checked style="display:inline"><span data-i18n="voiceGuidance"></span></label>
    <label class="file"><span data-i18n="testVideo"></span><input id="file" type="file" accept="video/*"></label>
  </div>
  <div class="row">
    <button id="glove" data-i18n="connectGlove"></button>
    <button id="log" disabled data-i18n="startLog"></button>
    <label class="file" style="display:flex;align-items:center;gap:6px"><input id="r10On" type="checkbox" style="display:inline"><span data-i18n="r10Receive"></span></label>
    <label class="file" style="display:flex;align-items:center;gap:6px"><input id="r10Speak" type="checkbox" style="display:inline"><span data-i18n="r10Speak"></span></label>
  </div>
  </div>
  <div id="msg"></div>

  <div class="stage" id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="hud"><span class="chip" id="fps" data-i18n="ready"></span><span class="chip" id="vis"></span></div>
    <div id="swOv" aria-hidden="true"><div id="swOvTitle"></div><div class="row4" id="swOvRow"></div></div>
    <div id="impOv" aria-hidden="true">
      <figure><canvas id="ovSnd"></canvas><figcaption id="ovSndCap" data-i18n="impactSound"></figcaption></figure>
      <figure><canvas id="ovVib"></canvas><figcaption id="ovVibCap" data-i18n="impactVibration"></figcaption></figure>
    </div>
  </div>

  <!-- results: the last swing and what the ball did, in one place -->
  <div class="chart" id="lastShot">
    <div class="head"><span id="lsTitle" style="font-size:15px;color:var(--fg)" data-i18n="lastSwingEmpty"></span><span id="lsPair" style="font-size:13px"></span></div>
    <div class="ls">
      <div class="num"><span data-i18n="tempo"></span><b id="lsTempo">–</b></div>
      <div class="num"><span data-i18n="releaseMs"></span><b id="lsRelease">–</b></div>
      <div class="num"><span data-i18n="hingeDeg"></span><b id="lsHinge">–</b></div>
      <div class="num"><span data-i18n="handPeakRate"></span><b id="lsHand">–</b></div>
      <div class="num r10"><span data-i18n="ballMph"></span><b id="lsBall">–</b></div>
      <div class="num r10"><span data-i18n="launchDeg"></span><b id="lsDir">–</b></div>
      <div class="num r10"><span data-i18n="pathDeg"></span><b id="lsPath">–</b></div>
      <div class="num r10"><span data-i18n="faceDeg"></span><b id="lsFace">–</b></div>
      <div class="num body"><span data-i18n="shoulderTurn"></span><b id="sh">–</b><small id="shMax"></small></div>
      <div class="num body"><span data-i18n="hipTurn"></span><b id="hp">–</b><small id="hpMax"></small></div>
      <div class="num body"><span data-i18n="xFactor"></span><b id="xf">–</b><small id="xfMax"></small></div>
      <div class="num body"><span data-i18n="headSway"></span><b id="hd">–</b><small id="hdMax"></small></div>
    </div>
    <div class="lskey"><span data-i18n="glove"></span><span class="r10" data-i18n="r10"></span><span class="body" data-i18n="camera"></span></div>
  </div>
  <div class="charts">
    <div class="chart" id="swingBox">
      <div class="head"><span id="swTitle" data-i18n="swingWaiting"></span><label style="display:flex;align-items:center;gap:6px;flex:none;font-size:13px;color:var(--fg)"><input id="swSpeak" type="checkbox"> <span data-i18n="readSwings"></span></label></div>
      <table class="sw">
        <colgroup><col style="width:2.6em"><col><col><col><col><col><col><col></colgroup>
        <tr><th>#</th><th data-i18n="tempo"></th><th data-i18n="release"></th><th data-i18n="hinge"></th><th data-i18n="handPeak"></th><th data-i18n="r10Ball"></th><th data-i18n="r10Launch"></th><th data-i18n="source"></th></tr>
        <tbody id="swRows"><tr><td colspan="8" style="text-align:left;color:var(--muted)" data-i18n="noSwing"></td></tr></tbody>
      </table>
      <details class="note"><summary data-i18n="details"></summary><span id="swNote" style="white-space:normal;line-height:1.5;font-size:13px;color:var(--muted)" data-i18n="swingHelp"></span></details>
    </div>
  </div>

  <!-- glove status and raw signals -->
  <div class="nums" id="gnums">
    <div class="num"><span data-i18n="gloveRate"></span><b id="gHz">–</b><small id="gState" data-i18n="disconnected"></small></div>
    <div class="num"><span data-i18n="dropped"></span><b id="gMiss">–</b><small id="gBatch"></small></div>
    <div class="num"><span data-i18n="gyroPeak"></span><b id="gGyro">–</b><small id="gSat"></small></div>
    <div class="num"><span data-i18n="battery"></span><b id="gBat">–</b><small id="gArm"></small></div>
    <div class="num"><span data-i18n="audioClips"></span><b id="gClips">0</b><small id="gLog"></small></div>
  </div>
  <div class="charts">
    <div class="chart" id="r10Box">
      <div class="head"><span data-i18n="r10Recent"></span><span id="r10State" style="font-size:13px" data-i18n="r10Off"></span></div>
      <table class="sw">
        <colgroup><col style="width:2.6em"><col><col><col><col><col><col></colgroup>
        <tr><th>#</th><th data-i18n="ballMphTable"></th><th data-i18n="launchTable"></th><th data-i18n="spinAxisTable"></th><th data-i18n="pathTable"></th><th data-i18n="faceTable"></th><th data-i18n="pairedSwing"></th></tr>
        <tbody id="r10Rows"><tr><td colspan="7" style="text-align:left;color:var(--muted)" data-i18n="noR10"></td></tr></tbody>
      </table>
      <details class="note"><summary data-i18n="details"></summary><span style="white-space:normal;line-height:1.5;font-size:13px;color:var(--muted)" data-i18n="r10Help"></span></details>
    </div>
    <div class="chart">
      <div class="head"><span id="impTitle" data-i18n="impactWaiting"></span></div>
      <canvas id="impImg" style="height:auto;aspect-ratio:3/4"></canvas>
      <canvas id="impCv"></canvas>
      <div class="head"><span><span class="key"><i style="background:#4fc3f7"></i><span data-i18n="handRotation"></span></span><span class="key"><i style="background:#ffb74d"></i><span data-i18n="forearmRotation"></span></span><span class="key"><i style="background:#eef1f3"></i><span data-i18n="cameraWrist"></span></span><span class="key"><i style="background:#ff4fa3"></i><span data-i18n="handHighRate"></span></span></span><span id="impNote"></span></div>
    </div>
    <div class="chart">
      <div class="head"><span data-i18n="liveSensors"></span></div>
      <table class="live">
        <colgroup><col class="part"><col span="4"></colgroup>
        <tr><th></th><th>x</th><th>y</th><th>z</th><th data-i18n="magnitude"></th></tr>
        <tr><td><span class="key" style="margin:0"><i style="background:#4fc3f7"></i><span data-i18n="handGyro"></span></span></td><td id="h0">–</td><td id="h1">–</td><td id="h2">–</td><td id="hG">–</td></tr>
        <tr><td><span class="key" style="margin:0"><i style="background:#4fc3f7"></i><span data-i18n="handAccel"></span></span></td><td id="h3">–</td><td id="h4">–</td><td id="h5">–</td><td id="hA">–</td></tr>
        <tr><td><span class="key" style="margin:0"><i style="background:#ffb74d"></i><span data-i18n="armGyro"></span></span></td><td id="a0">–</td><td id="a1">–</td><td id="a2">–</td><td id="aG">–</td></tr>
        <tr><td><span class="key" style="margin:0"><i style="background:#ffb74d"></i><span data-i18n="armAccel"></span></span></td><td id="a3">–</td><td id="a4">–</td><td id="a5">–</td><td id="aA">–</td></tr>
      </table>
    </div>
    <div class="chart">
      <div class="head"><span data-i18n="gloveRotation"></span><span><span class="key"><i style="background:#4fc3f7"></i><span data-i18n="hand"></span></span><span class="key"><i style="background:#ffb74d"></i><span data-i18n="forearm"></span></span></span></div>
      <canvas id="gyroCv"></canvas>
    </div>
    <div class="chart">
      <div class="head"><span data-i18n="phoneSpectrogram"></span><button id="mic" style="padding:6px 10px;font-size:13px;white-space:nowrap;flex:none" data-i18n="micOn"></button></div>
      <canvas id="specCv"></canvas>
    </div>
    <div class="chart">
      <div class="head"><span id="clipTitle" data-i18n="clipWaiting"></span></div>
      <canvas id="clipCv"></canvas>
    </div>
  </div>

  <!-- settings -->
  <div class="language" role="group" data-i18n-aria="language">
    <span data-i18n="language"></span>
    <button class="chip" data-language="ko" data-i18n="ko"></button>
    <button class="chip" data-language="en" data-i18n="en"></button>
  </div>
  <div class="chart" id="voiceBox">
    <div class="head"><span data-i18n="voiceCommands"></span><label style="display:flex;align-items:center;gap:6px;flex:none;font-size:13px;color:var(--fg)"><input id="vCont" type="checkbox"> <span data-i18n="keepListening"></span></label></div>
    <div class="row"><button id="vTalk" data-i18n="talk"></button><span id="vHeard" style="font-size:14px;color:var(--muted);align-self:center;min-width:0;flex:1" data-i18n="voiceExamples"></span></div>
  </div>
  <div class="chart" id="gestBox">
    <div class="head"><label style="display:flex;align-items:center;gap:8px;color:var(--fg);font-size:14px;cursor:pointer"><input id="gOn" type="checkbox"> <span data-i18n="gestureCommands"></span></label><span id="gLast" style="font-size:13px"></span></div>
    <div id="gBody" style="display:none">
      <table class="sw" id="gTable"><colgroup><col style="width:40%"><col></colgroup><tbody id="gRows"></tbody></table>
      <div class="head"><span style="white-space:normal;line-height:1.5" data-i18n="gestHelp"></span></div>
    </div>
  </div>
  <div class="chart" id="quick">

<script type="module">
import { Glove, clipSamples, motionFrames, GYRO_DPS, ACC_G, SAT_DPS } from "./glove.js";
import { SwingDetector, swingLine } from "./swing.js";
import { VoiceCommands, Listener } from "./voice.js";
import { GestureDetector } from "./gesture.js";
import { R10Link, pairShots, shotLine } from "./r10.js";
import { LANGUAGE_KEY, pickLanguage, speechLocale, text } from "./strings.js";
const PAGE_VER = "2026-11-15c";
const GLOVE_HZ = 240;   // the glove firmware's rate (was a menu with 400 for PC tests and 180 for old firmware)

const $ = (id) => document.getElementById(id);
const savedLanguage = () => { try { return localStorage.getItem(LANGUAGE_KEY); } catch { return null; } };
// The R10 Bridge app passes its own KO/EN choice as ?lang=; it wins over the page's saved choice.
const urlLanguage = new URLSearchParams(location.search).get("lang");
if (urlLanguage === "ko" || urlLanguage === "en") { try { localStorage.setItem(LANGUAGE_KEY, urlLanguage); } catch {} }
let language = pickLanguage(urlLanguage === "ko" || urlLanguage === "en" ? urlLanguage : savedLanguage(), navigator.language);
const t = (key, ...args) => text(key, language, ...args);
const ko = (key) => text(key, "ko");
const boundText = new Map();
function bindText(id, render) {
  boundText.set(id, render);
  $(id).textContent = render();
}
const setText = (id, key, ...args) => bindText(id, () => t(key, ...args));
function applyLanguage() {
  document.documentElement.lang = language;
  for (const el of document.querySelectorAll("[data-i18n]")) {
    if (!boundText.has(el.id)) el.textContent = t(el.dataset.i18n);
  }
  // Help paragraphs contain trusted markup from the strings table.
  for (const el of document.querySelectorAll("[data-i18n-html]")) el.innerHTML = t(el.dataset.i18nHtml);
  for (const el of document.querySelectorAll("[data-i18n-aria]")) el.setAttribute("aria-label", t(el.dataset.i18nAria));
  for (const [id, render] of boundText) $(id).textContent = render();
  for (const button of document.querySelectorAll("[data-language]")) {

    button.setAttribute("aria-pressed", selected);
    button.classList.toggle("on", selected);
  }
}
applyLanguage();
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
const MODELS = {
  lite: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task",
  full: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task",
};
const EDGES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[15,19],[16,20],[27,31],[28,32]];
let pose = null, running = false, base = null, peaks = null, recorder = null, chunks = [];
let lastT = performance.now(), fpsAvg = 0, frames = 0;
window.__stats = { frames: 0, found: 0, fps: 0, last: null };

// Messages are a toast near the top that fades out after MSG_MS (they used to take a fixed two-line row above the camera).
const MSG_MS = 4500; let msgTimer = null;
const say = (t) => {
  const m = $("msg"); m.textContent = t || ""; clearTimeout(msgTimer);
  if (!t) { m.classList.remove("show"); return; }
  m.classList.add("show"); msgTimer = setTimeout(() => m.classList.remove("show"), MSG_MS);
};

async function loadModel() {
  say(t("loadingModel"));
  const { PoseLandmarker, FilesetResolver } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs");
  const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");
  const opts = (delegate) => ({ baseOptions: { modelAssetPath: MODELS.full, delegate }, runningMode: "VIDEO", numPoses: 1 });
  try { pose = await PoseLandmarker.createFromOptions(files, opts("GPU")); }
  catch (e) { pose = await PoseLandmarker.createFromOptions(files, opts("CPU")); }
  say("");
}

function fit() {
  const w = video.videoWidth || 1280, h = video.videoHeight || 720;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  $("stage").style.aspectRatio = `${w} / ${h}`;
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const turn = (w, w0) => (180 / Math.PI) * Math.acos(Math.max(0, Math.min(1, w / w0)));

function measure(p) {
  const W = canvas.width, H = canvas.height;
  const P = p.map((q) => ({ x: q.x * W, y: q.y * H, v: q.visibility ?? 1 }));
  return { sh: dist(P[11], P[12]), hp: dist(P[23], P[24]), head: P[0].x, headW: dist(P[7], P[8]), P };
}

function show(id, v, unit = "°", digits = 0) { $(id).textContent = v == null || isNaN(v) ? "–" : v.toFixed(digits) + unit; }

function draw(P) {
  ctx.lineWidth = Math.max(3, canvas.width / 240); ctx.strokeStyle = "#ff3b30";   // red: the light blue was hard to see
  for (const [a, b] of EDGES) {
    if (P[a].v > 0.4 && P[b].v > 0.4) { ctx.beginPath(); ctx.moveTo(P[a].x, P[a].y); ctx.lineTo(P[b].x, P[b].y); ctx.stroke(); }
  }
  for (let k = 0; k < 33; k++) {
    if (P[k].v < 0.4) continue;
    ctx.fillStyle = k === 15 || k === 16 ? "#ffeb3b" : "#ffffff";   // wrists yellow on the red skeleton
    ctx.beginPath(); ctx.arc(P[k].x, P[k].y, Math.max(3, canvas.width / 250), 0, 2 * Math.PI); ctx.fill();
  }
}

// ---- spoken framing check (you can't see the screen with the rear camera) ----
let frameState = "", frameSince = 0, frameSaid = "", frameSaidAt = 0;
function speak(t) {
  if (!$("speak").checked || !window.speechSynthesis) return;
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = speechLocale(language); u.rate = 1.1; speechSynthesis.speak(u);
}
// Framing is judged only while the golfer is still. In a swing or waggle the hands blur and MediaPipe drops the wrists
// even with the whole body in view, so the hands-out-of-frame alert kept coming during swings. Moving = glove gyro over
// FRAME_MOVE_DPS (hand or forearm), or a wrist jumping across the image, within the last FRAME_QUIET_MS.
const FRAME_HOLD_MS = 2000, FRAME_GAP_MS = 10000, FRAME_REPEAT_MS = 30000, FRAME_QUIET_MS = 3000, FRAME_MOVE_DPS = 250;
let lastMoveMs = -Infinity, lastWrist = null;
function framing(lm) {
  const now = performance.now();
  if (lm) {
    const w = [lm[15], lm[16]];
    // Only well-seen wrists count: jitter in a guessed wrist would otherwise suppress the framing alert.
    if (lastWrist && w.some((q, i) => (q.visibility ?? 1) > 0.5 && lastWrist[i].v > 0.5 &&
        Math.hypot(q.x - lastWrist[i].x, q.y - lastWrist[i].y) > 0.05)) lastMoveMs = now;
    lastWrist = w.map((q) => ({ x: q.x, y: q.y, v: q.visibility ?? 1 }));
  }
  if (now - lastMoveMs < FRAME_QUIET_MS) { frameState = ""; return; }   // moving: say nothing, start the hold afresh
  let st;
  if (!lm) st = "frameNobody";
  else {
    const ok = (k, v = 0.5) => (lm[k].visibility ?? 1) > v && lm[k].x > 0.02 && lm[k].x < 0.98 && lm[k].y > 0.02 && lm[k].y < 0.98;
    if (![0, 7, 8].some((k) => ok(k))) st = "frameHead";
    else if (![27, 28, 31, 32].every((k) => ok(k))) st = "frameFeet";
    else if (![15, 16].every((k) => ok(k, 0.3))) st = "frameHands";   // wrists in front of the body often score 0.3-0.5
    else st = "frameFull";
  }
  if (st !== frameState) { frameState = st; frameSince = now; }
  // Was: said after 0.8 s and a problem repeated every 6 s, which nagged ("목소리 너무 자주 반복돼"). Now a state must
  // hold FRAME_HOLD_MS, framing lines are FRAME_GAP_MS apart, the same problem comes back only after FRAME_REPEAT_MS,
  // "nobody there" and "all in view" are said once, and a framing line never cuts off other speech.
  const repeat = st !== "frameFull" && st !== "frameNobody" && now - frameSaidAt > FRAME_REPEAT_MS;
  if (now - frameSince > FRAME_HOLD_MS && now - frameSaidAt > FRAME_GAP_MS && (st !== frameSaid || repeat) &&
      !(window.speechSynthesis && speechSynthesis.speaking)) { speak(t(st)); frameSaid = st; frameSaidAt = now; }
}

// Camera frame time: the capture time Chrome reports for this frame (requestVideoFrameCallback), when it has one.
// It is on the same clock as performance.now(); detection finishes tens of ms later, which is not when the image was taken.
let capTime = null;
function watchFrames() {
  if (!video.requestVideoFrameCallback) return;
  const cb = (_now, md) => { capTime = md.captureTime ?? md.expectedDisplayTime ?? null; video.requestVideoFrameCallback(cb); };
  video.requestVideoFrameCallback(cb);
}
// Last ~4 s of small camera frames + landmarks, to show the frame at an impact that the glove reports 1-2 s later.
const ring = [], pool = [], wristBuf = [];
function keepFrame(t, lm) {
  const c = pool.pop() || document.createElement("canvas");
  c.width = 320; c.height = Math.round(320 * (video.videoHeight || 720) / (video.videoWidth || 1280));
  c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
  ring.push({ t, c, lm });
  while (ring.length && ring[ring.length - 1].t - ring[0].t > 4000) pool.push(ring.shift().c);
  if (lm) { const w = lm[16]; wristBuf.push([t, w.x, w.y, w.visibility ?? 1]); }
  while (wristBuf.length && t - wristBuf[0][0] > 6000) wristBuf.shift();
}

function loop() {
  if (!running) return;
  if (video.readyState >= 2 && !video.paused) {
    fit();
    const now = performance.now();
    const res = pose.detectForVideo(video, now);
    const ft = capTime ?? now;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    keepFrame(ft, res.landmarks && res.landmarks.length ? res.landmarks[0] : null);
    if (logging) log.cap.push(+ft.toFixed(1));
    frames++; window.__stats.frames++;
    const dt = now - lastT; lastT = now; fpsAvg = fpsAvg ? 0.9 * fpsAvg + 0.1 * (1000 / dt) : 1000 / dt;
    if (logging) log.pose.push(res.landmarks && res.landmarks.length   // every camera frame: its time matters for sync even with no person
      ? [+now.toFixed(1), ...res.landmarks[0].flatMap((q) => [+q.x.toFixed(4), +q.y.toFixed(4), +(q.visibility ?? 1).toFixed(2)])]
      : [+now.toFixed(1)]);
    framing(res.landmarks && res.landmarks.length ? res.landmarks[0] : null);
    if (res.landmarks && res.landmarks.length) {
      window.__stats.found++;
      const m = measure(res.landmarks[0]);
      draw(m.P);

      const wv = (m.P[15].v + m.P[16].v) / 2;
      setText("vis", "wristConfidence", (wv * 100).toFixed(0));
      if (base) {
        const s = turn(m.sh, base.sh), h = turn(m.hp, base.hp), x = s - h, hd = (m.head - base.head) / base.headW;
        show("sh", s); show("hp", h); show("xf", x); show("hd", hd, "", 2);
        peaks.sh = Math.max(peaks.sh, s); peaks.hp = Math.max(peaks.hp, h); peaks.xf = Math.max(peaks.xf, x); peaks.hd = Math.max(peaks.hd, Math.abs(hd));
        setText("shMax", "maxDegrees", peaks.sh.toFixed(0)); setText("hpMax", "maxDegrees", peaks.hp.toFixed(0));
        setText("xfMax", "maxDegrees", peaks.xf.toFixed(0)); setText("hdMax", "maxUnitless", peaks.hd.toFixed(2));
        window.__stats.last = { sh: s, hp: h, xf: x, hd };
      }
      window.__lastMeasure = m;
    } else {
      setText("vis", "findingPerson");
    }
    if (frames % 10 === 0) { setText("fps", "fps", fpsAvg.toFixed(0)); window.__stats.fps = fpsAvg; }
  }
  requestAnimationFrame(loop);
}

async function begin(source) {
  try {
    if (!pose) await loadModel();
    running = true; base = null; peaks = null; watchFrames();
    $("base").disabled = false; $("rec").disabled = typeof MediaRecorder === "undefined";
    lastT = performance.now(); requestAnimationFrame(loop);
    say(source === "camera" ? t("cameraAddress") : t("fileAddress"));
  } catch (e) { say(t("modelError")); console.error(e); }
}

// Camera: front only (the golfer watches the screen), 4:3 (the sensor's full height, more room head to toe).
// On a Galaxy S25 "camera 1, facing front" is the wide front lens (camera 3 is narrow). Other phones name their
// cameras differently, so anywhere else we take the phone's default front camera.
const WIDE_FRONT = /^camera 1, facing front$/i;
let camStream = null;
async function wideFront() {
  try { return (await navigator.mediaDevices.enumerateDevices()).find((d) => d.kind === "videoinput" && WIDE_FRONT.test(d.label)) || null; }
  catch (e) { return null; }
}
async function openCamera() {
  if (camStream) camStream.getTracks().forEach((t) => t.stop());
  const base = { width: { ideal: 1280 }, height: { ideal: 960 }, frameRate: { ideal: 30 } };
  const get = (d) => navigator.mediaDevices.getUserMedia({ audio: false, video: d ? { ...base, deviceId: { exact: d.deviceId } } : { ...base, facingMode: "user" } });
  let wide = await wideFront();
  camStream = await get(wide);
  if (!wide) {   // camera names appear only after permission: the first time, switch to the wide lens if there is one
    wide = await wideFront();
    if (wide && !WIDE_FRONT.test(camStream.getVideoTracks()[0].label)) { camStream.getTracks().forEach((t) => t.stop()); camStream = await get(wide); }
  }
  video.srcObject = camStream; await video.play();
  if (video.videoWidth) $("impImg").style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
  // Mirror only what's on screen (CSS), like a mirror. The canvas pixels, the landmarks, the recording and the saved
  // log stay as the camera sees, so a right-handed golfer stays right-handed in the data.
  for (const id of ["canvas", "impImg"]) $(id).style.transform = "scaleX(-1)";
  const set = camStream.getVideoTracks()[0].getSettings();
  say(t("cameraOpened", set.width, set.height));
}
$("start").onclick = async () => {
  try { await openCamera(); if (!running) await begin("camera"); }
  catch (e) { say(t("cameraError")); console.error(e); }
};

$("file").onchange = async (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  video.srcObject = null; video.src = URL.createObjectURL(f); video.loop = true; await video.play(); await begin("file");
};

$("base").onclick = () => {
  const m = window.__lastMeasure;
  if (!m) { say(t("addressNoPerson")); return; }
  base = { sh: m.sh, hp: m.hp, head: m.head, headW: m.headW }; peaks = { sh: 0, hp: 0, xf: 0, hd: 0 };
  say(t("addressReady"));
};


// ---- sensor glove (Web Bluetooth) ----
let lastStatus = null;
let glove = null, logging = false, log = null, gStats = { n: 0, t0: 0, hand: 0, arm: 0, clips: 0 };
function gloveText(id, t) { $(id).textContent = t; }
function onGlove(r) {
  if (r.type === "imu") {
    gStats.n += r.frames.length;
    for (const f of r.frames) {
      const h = Math.max(Math.abs(f[3]), Math.abs(f[4]), Math.abs(f[5])) * GYRO_DPS, a = Math.max(Math.abs(f[9]), Math.abs(f[10]), Math.abs(f[11])) * GYRO_DPS;
      gStats.hand = Math.max(gStats.hand, h); gStats.arm = Math.max(gStats.arm, a);
      gyroBuf.push([f[2] / 1e6, h, a]); lastFrame = f;
      if (h > FRAME_MOVE_DPS || a > FRAME_MOVE_DPS) lastMoveMs = performance.now();   // framing stays quiet while moving
      gyroLong.push([f[2], h, a]); if (gyroLong.length > 1400) gyroLong.shift();
      if (logging) log.glove.push(f);
      const fu = [f[2] / 1e6, f[3] * GYRO_DPS, f[4] * GYRO_DPS, f[5] * GYRO_DPS, f[6] * ACC_G, f[7] * ACC_G, f[8] * ACC_G,
                  f[9] * GYRO_DPS, f[10] * GYRO_DPS, f[11] * GYRO_DPS, f[12] * ACC_G, f[13] * ACC_G, f[14] * ACC_G];
      swingDet.frame(fu); armWatch();
      if (gCfg.on) { gestDet.armOk = !!(glove && glove.parser.armOk); gestDet.frame(fu); }
      lastHandAcc = [fu[4], fu[5], fu[6]];
    }
  } else if (r.type === "status") {
    lastStatus = r;
    gloveText("gBat", (r.mv / 1000).toFixed(2) + " V");
    bindText("gArm", () => t(r.armOk ? (armDead ? "armZero" : "armPresent") : "armMissing") + (r.charging ? t("charging") : ""));
    if (logging) log.status.push(r);
  } else if (r.type === "clip" && r.clip.kind === "motion") {   // 833 Hz gyro around the impact, after its sound clip
    const c = r.clip, m = motionFrames(c); motionById.set(c.id, m);
    if (lastImpact && lastImpact.id === c.id) ovVibration(c, m);
    if (lastImpact && lastImpact.id === c.id) setTimeout(() => drawImpact(lastImpact), 0);
    if (logging) log.motion.push({ id: c.id, t_us: c.t_us, impactFrame: c.pre, frames: m.t.length, rate: c.rate / 10, flags: c.peak, t: m.t, g: Array.from(m.g) });
  } else if (r.type === "clip") {
    gStats.clips++; gloveText("gClips", String(gStats.clips));
    const c = r.clip; drawClip(c); if (c.kind === "impact") { swingDet.sound(c.t_us / 1e6); setTimeout(() => drawImpact(c), 0); ovSound(c); }
    bindText("gLog", () => t("clipDuration", t(c.kind === "voice" ? "voice" : "impact"), (c.total / c.rate).toFixed(1)));
    if (logging) log.clips.push({ kind: c.kind, id: c.id, t_us: c.t_us, pre: c.pre, total: c.total, rate: c.rate, peak: c.peak, firstNow: c.firstNow, lastNow: c.lastNow,
      partial: !!c.partial, missingChunks: c.missingN ?? null, chunks: c.chunks ?? null, samples: Array.from(clipSamples(c)) });
  } else if (r.type === "clipLost") {   // a sound clip with too few chunks (or no header) to keep
    if (logging) log.clipsLost.push({ ...r.lost, phoneMs: +performance.now().toFixed(1) });
  }
}
setInterval(() => {
  if (!glove) return;
  const now = performance.now(), dt = (now - gStats.t0) / 1000;
  if (dt >= 1) {
    gloveText("gHz", (gStats.n / dt).toFixed(0) + " Hz"); gStats.n = 0; gStats.t0 = now;
    gloveText("gMiss", String(glove.parser.missing));
    // big number = peak of the last 3 s (from the chart buffer); small line = session max since connect / log start
    const tEnd = gyroBuf.length ? gyroBuf[gyroBuf.length - 1][0] : 0; let h3 = 0, a3 = 0;
    for (const r of gyroBuf) if (r[0] >= tEnd - 3) { h3 = Math.max(h3, r[1]); a3 = Math.max(a3, r[2]); }
    gloveText("gGyro", `${h3.toFixed(0)} / ${a3.toFixed(0)}`);
    const hit = h3 >= SAT_DPS - 1 || a3 >= SAT_DPS - 1;
    bindText("gSat", () => t("gyroStats", hit ? t("saturated") : "", gStats.hand.toFixed(0), gStats.arm.toFixed(0)));
    if (logging) setText("gLog", "loggingSeconds", ((now - log.t0) / 1000).toFixed(0));
  }
}, 250);

let dropByUs = false;   // true while the page itself drops the link (button, page hidden, reconnect retry); any other drop is unexpected
function gloveState(st) {
  setText("gState", st === "connected" ? "connected" : "linkDropped");
  if (st === "connected") keepAwake(); else releaseAwake();
  setText("glove", st === "connected" ? "disconnectGlove" : "connectGlove");
  $("log").disabled = st !== "connected";
  const wasLogging = logging;
  if (st !== "connected" && logging) { qEvent("glove_drop", { byUs: dropByUs }, "glove"); stopLog(); }
  // Unexpected drop (glove RST or watchdog, out of range, radio hiccup; range 2026-11-15: after an RST the page sat at
  // t("linkDropped") until the user noticed): reconnect to the same glove by itself, as after the screen comes back on.
  if (st !== "connected" && !dropByUs && glove && !resume) {
    resume = { log: wasLogging };
    // hidden (the glove can drop a backgrounded page whose heartbeats stalled): reconnect when it is shown again
    if (document.visibilityState === "visible") setTimeout(() => { if (resume && !gloveConnected()) reconnect(); }, 1000);
  }
  if (st !== "connected") dropByUs = false;
}
async function afterConnect(p) {   // after a first connect or an automatic reconnect
  setText("gBatch", p.probeLen ? "packetSize" : "packetUnknown", p.probeLen, p.batch);
  gStats = { n: 0, t0: performance.now(), hand: 0, arm: 0, clips: 0 };
  await glove.start(GLOVE_HZ, 1); await glove.send("status");
}
$("glove").onclick = async () => {
  resume = null;
  if (glove && glove.device && glove.device.gatt.connected) { dropByUs = true; await glove.stop().catch(() => {}); glove.disconnect(); return; }
  try {
    glove = new Glove(onGlove, gloveState);
    say(t("scanGlove"));
    await afterConnect(await glove.connect());
    say(t("gloveReady"));
  } catch (e) {
    console.error(e);
    say(e.message === "no-web-bluetooth" ? t("noBluetooth") :
        e.name === "NotFoundError" ? t("gloveNotFound") : t("gloveError", e.message));
  }
};

// ---- swing analysis (swing.js, ported from analysis/swing_eye.py) ----
const swings = [];

        if (qEditing) { qList[kind].splice(i, 1); qSave(); qRender(); return; }
        if (kind === "label") { labelLast(name, "tap"); return; }
        setSetting(kind, cur[kind] === name && kind !== "player" ? null : name, "tap");   // tap again to clear club / swing
      };
      box.appendChild(b);
    });
    if (qEditing) {
      const a = document.createElement("button"); a.className = "chip add"; a.textContent = t("addButton");
      a.onclick = () => { const v = (prompt(t("addName", t(Q_NAME[kind]))) || "").trim(); if (v && !qList[kind].some((name) => name === v || displayName(name) === v)) { qList[kind].push(v); qSave(); qRender(); } };
      box.appendChild(a);
    }
  }
  if (qEditing) {
    const r = document.createElement("button"); r.className = "chip add"; r.textContent = t("resetButtons");
    r.onclick = () => { if (confirm(t("confirmReset"))) { qList = JSON.parse(JSON.stringify(Q_DEFAULT)); qSave(); qRender(); } };
    box.appendChild(r);
  }
}
$("qEdit").onclick = () => { qEditing = !qEditing; setText("qEdit", qEditing ? "done" : "edit"); qRender(); };
// collapsed unless checked; the choice is remembered on this phone
const qShow = (on) => { $("qBody").style.display = on ? "" : "none"; $("qEdit").style.display = on ? "" : "none"; if (!on && qEditing) $("qEdit").click(); };
$("qOn").checked = (() => { try { return localStorage.getItem("pg-quick-on") === "1"; } catch (e) { return false; } })();
$("qOn").onchange = () => { try { localStorage.setItem("pg-quick-on", $("qOn").checked ? "1" : "0"); } catch (e) {} qShow($("qOn").checked); };
qShow($("qOn").checked);
qRender();
const EDGE2 = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function drawImpact(c) {
  lastImpact = c;
  const clock = glove.parser.clock; if (!clock.ready()) return;
  const ti = clock.toPhone(c.t_us);
  let best = null; for (const f of ring) if (!best || Math.abs(f.t - ti) < Math.abs(best.t - ti)) best = f;
  const note = { id: c.id, impactPhoneMs: +ti.toFixed(1), frameMs: best ? +best.t.toFixed(1) : null, player: cur.player, club: cur.club, swing: cur.swing };
  if (logging && !log.impacts.some((x) => x.id === note.id)) log.impacts.push(note);
  // frame + skeleton (right wrist red)
  const im = $("impImg"), gi = im.getContext("2d");
  if (best) {
    im.width = best.c.width; im.height = best.c.height; im.style.aspectRatio = `${im.width} / ${im.height}`;
    gi.drawImage(best.c, 0, 0);
    if (best.lm) {
      const P = best.lm.map((q) => [q.x * im.width, q.y * im.height, q.visibility ?? 1]);
      gi.strokeStyle = "#ff3b30"; gi.lineWidth = 2;
      for (const [a, b] of EDGE2) if (P[a][2] > 0.4 && P[b][2] > 0.4) { gi.beginPath(); gi.moveTo(P[a][0], P[a][1]); gi.lineTo(P[b][0], P[b][1]); gi.stroke(); }
      for (const k of [15, 16]) if (P[k][2] > 0.2) { gi.fillStyle = k === 16 ? "#ffeb3b" : "#ffffff"; gi.beginPath(); gi.arc(P[k][0], P[k][1], 4, 0, 7); gi.fill(); }
    }
  } else { gi.clearRect(0, 0, im.width, im.height); }
  // +-1 s chart on the phone clock
  const cv = $("impCv"), [W, H] = sizeCv(cv), g = cv.getContext("2d"), d = devicePixelRatio;
  g.clearRect(0, 0, W, H);
  const X = (t) => (t - ti + 1000) / 2000 * W, Y = (v, top) => H - 4 * d - Math.min(v, top) / top * (H - 10 * d);
  g.strokeStyle = "#2d353b"; g.lineWidth = d; for (const v of [-1000, -500, 0, 500, 1000]) { g.beginPath(); g.moveTo(X(ti + v), 0); g.lineTo(X(ti + v), H); g.stroke(); }
  g.fillStyle = "#9aa5ad"; g.font = `${11 * d}px system-ui`; g.fillText(t("minusSecond"), 2 * d, 12 * d); g.fillText(t("plusSecond"), W - 26 * d, 12 * d);
  for (const [k, col] of [[1, "#4fc3f7"], [2, "#ffb74d"]]) {
    g.strokeStyle = col; g.lineWidth = 2 * d; g.beginPath(); let first = true;
    for (const r of gyroLong) { const t = clock.toPhone(r[0]); if (t < ti - 1000 || t > ti + 1000) continue; first ? g.moveTo(X(t), Y(r[k], 2400)) : g.lineTo(X(t), Y(r[k], 2400)); first = false; }
    g.stroke();
  }
  const mo = motionById.get(c.id);
  if (mo) {   // 833 Hz hand gyro from the glove's FIFO: thin light line over the 240 Hz trace
    g.strokeStyle = "#ff4fa3"; g.lineWidth = 1.5 * d; g.beginPath(); let f1 = true;
    for (let i = 0; i < mo.t.length; i++) {
      const t = clock.toPhone(mo.t[i]); if (t < ti - 1000 || t > ti + 1000) continue;
      const v = Math.hypot(mo.g[6 * i], mo.g[6 * i + 1], mo.g[6 * i + 2]) * GYRO_DPS;
      f1 ? g.moveTo(X(t), Y(v, 2400)) : g.lineTo(X(t), Y(v, 2400)); f1 = false;
    }
    g.stroke();
  }
  const sp = []; for (let i = 1; i < wristBuf.length; i++) { const [t0, x0, y0, v0] = wristBuf[i - 1], [t1, x1, y1, v1] = wristBuf[i]; if (v0 > 0.3 && v1 > 0.3 && t1 > t0) sp.push([t1, Math.hypot(x1 - x0, y1 - y0) / (t1 - t0) * 1000]); }
  const top = Math.max(0.5, ...sp.filter((r) => Math.abs(r[0] - ti) < 1000).map((r) => r[1]));
  g.strokeStyle = "#eef1f3"; g.lineWidth = 2 * d; g.beginPath(); let first = true;
  for (const [t, v] of sp) { if (t < ti - 1000 || t > ti + 1000) continue; first ? g.moveTo(X(t), Y(v, top)) : g.lineTo(X(t), Y(v, top)); first = false; }
  g.stroke();
  g.strokeStyle = "#ff5252"; g.lineWidth = 2 * d; g.beginPath(); g.moveTo(X(ti), 0); g.lineTo(X(ti), H); g.stroke();
  if (best) { g.setLineDash([4 * d, 3 * d]); g.strokeStyle = "#eef1f3"; g.beginPath(); g.moveTo(X(best.t), 0); g.lineTo(X(best.t), H); g.stroke(); g.setLineDash([]); }
  setText("impTitle", "impactNumberNote", c.id);
  bindText("impNote", () => (mo ? t("motionFrames", mo.t.length) : "") +
    (best ? t("impactFrame", (best.t - ti >= 0 ? "+" : "") + (best.t - ti).toFixed(0)) : t("noImpactFrame")));
}


function stopLog() {
  logging = false; setText("log", "startLog"); document.body.classList.remove("recording"); ckptDrop();
  const ck = glove && glove.parser.clock;
  log.sync = ck && ck.ready() ? { note: "phone_ms = glove_ms + b + a * (glove_ms - t0), glove_ms = t_us / 1000", a: ck.a, b: ck.b, t0: ck.t0 } : null;
  const meta = { saved: new Date().toISOString(), userAgent: navigator.userAgent, micSpectrogram: !!analyser, camera: running, page: PAGE_VER, batch: glove && glove.batch, probeLen: glove && glove.parser.probeLen,
    missing: glove && glove.parser.missing - log.missing0, hz: GLOVE_HZ, units: { glove: "[phone_ms, seq, glove_t_us, hand gx gy gz ax ay az, arm gx gy gz ax ay az] raw: gyro 0.07 dps/LSB, acc 0.000488 g/LSB",
    pose: "[phone_ms, 33 x (x, y, visibility)] normalized image coords; [phone_ms] alone = frame with no person", cap: "camera capture time per pose row (phone ms; = detect time if the browser gives none)",
    swings: "swing.js per swing: t_imp = glove s, source = sound|accel|arm peak, tempo = back_s/down_s, release_ms from impact (- = before), hinge deg relative to address",
    r10: "R10 Bridge shots: arrivalMs = phone ms when the page got it; swing = paired swing n (null = none), lagMs = arrival - swing impactPhoneMs; msg = app message {shot, t_wall_ms, ball{BallSpeed mph (R10 via E6), LaunchAngle, LaunchDirection, TotalSpin rpm, SpinAxis}, club{ClubHeadSpeed, ClubAnglePath, ClubAngleFace}} as the Garmin app sends them" } };
  const blob = new Blob([JSON.stringify({ meta, ...log })], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `swing-glove-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-")}.json`; a.click();
  speak(t("savedSpoken"));
  say(t("savedCounts", log.glove.length, log.pose.length, log.clips.length));
}
$("log").onclick = () => {
  if (logging) { stopLog(); return; }
  gStats.hand = 0; gStats.arm = 0;
  log = { cap: [], impacts: [], motion: [], swings: [], events: [{ phoneMs: +performance.now().toFixed(1), action: "settings", value: { ...cur }, source: "log start" }], labels: [], r10: [], dialChecks: [], swingsDropped: [], clipsLost: [], t0: performance.now(), glove: [], pose: [], status: [], clips: [], missing0: glove ? glove.parser.missing : 0 };
  logging = true; setText("log", "stopSaveLog"); document.body.classList.add("recording");
  dock.fold(); speak(t("startLog")); say(t(running ? "loggingGlovePose" : "loggingGlove"));
};

$("rec").onclick = () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  chunks = [];
  recorder = new MediaRecorder(canvas.captureStream(30), { mimeType: MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm" });
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
    a.download = `swing-pose-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-")}.webm`; a.click();
    setText("rec", "recordVideo"); say(t("saved"));
  };
  recorder.start(); setText("rec", "stopSaveVideo"); say(t("videoRecording"));
};

for (const button of document.querySelectorAll("[data-language]")) button.onclick = () => {
  const selected = button.dataset.language;
  try { localStorage.setItem(LANGUAGE_KEY, selected); } catch {}
  if (selected === language) return;
  language = selected;
  applyLanguage();
  listener.setLanguage(language);
  if (window.speechSynthesis) speechSynthesis.cancel();
  listener.resume();
  frameSaid = "";
  say("");
  if (swings.length) renderSwings(false);
  if (r10Shots.length) renderR10();
  if (lastImpact && glove?.parser.clock.ready()) drawImpact(lastImpact);
  gRender();
  qRender();
};
